grafana:
  enabled: false


alertmanager:
  config:
    global:
      resolve_timeout: 5m
    route:
      group_by: ['alertname']
      group_wait: 10s
      group_interval: 10s
      repeat_interval: 1m
      receiver: 'flask-webhook'
      routes:
        - matchers:
            - alertname = 'Watchdog'
          receiver: 'null'
    receivers:
      - name: 'null'
      - name: 'flask-webhook'
        webhook_configs:
          - url: 'http://host.docker.internal:5000/alert'
            send_resolved: true