apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: nginx-down-rule
  namespace: monitoring
  labels:
    release: monitoring
spec:
  groups:
    - name: web-prod-alerts
      rules:
        - alert: NginxReplicasLow
          expr: kube_deployment_status_replicas_available{namespace="web-prod", deployment="web-deployment"} < 2
          for: 15s
          labels:
            severity: critical
          annotations:
            summary: "Za mało replik nginxa w web-prod"